# MySQL 8 para desarrollo local.
#   pnpm db:up
#   pnpm db:down
#
# La app/frontend usa 127.0.0.1:3307 en desarrollo (el 3306 suele estar ocupado
# por un MySQL local). db/schema.sql se carga automáticamente la primera vez que
# se crea el volumen.
services:
  mysql:
    image: mysql:8.0
    container_name: ssa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ssa_dev_root
      MYSQL_DATABASE: sistemaaccesofacultad
    ports:
      - "3307:3306"
    command:
      - --default-time-zone=-06:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - ssa_mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pssa_dev_root"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ssa_mysql_data:
